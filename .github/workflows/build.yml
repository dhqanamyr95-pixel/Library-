name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # اگر پروژه را به صورت library-app.zip آپلود کردی، خودکار باز می‌شود
      - name: Unzip project if needed
        run: |
          if [ -f library-app.zip ] && [ ! -d www ]; then
            unzip -o library-app.zip
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Copy PDF reader library
        run: |
          mkdir -p www/lib
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/pdf.worker.min.js

      - name: Add Android
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: library-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
